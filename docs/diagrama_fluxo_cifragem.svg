<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="940" height="620" viewBox="0 0 940 620" font-family="Segoe UI, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0,0 10,3.5 0,7" fill="#2c3e50"/>
    </marker>
    <linearGradient id="gk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f4f7f6;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#d6e4e0;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="ge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#eef2ff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#c7cdfe;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="gc" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fff7ed;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ffd8b1;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <text x="470" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a3a5c">Figura 2 — Fluxo de Cifragem de uma Mensagem v3 (remetente → destinatário)</text>

  <!-- Coluna Remetente -->
  <g transform="translate(30,60)">
    <rect x="0" y="0" width="420" height="520" rx="10" fill="url(#gk)" stroke="#2c3e50" stroke-width="2"/>
    <text x="210" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a3a5c">Remetente (Agente A)</text>

    <rect x="20" y="45" width="380" height="70" rx="6" fill="#fff" stroke="#7f8c8d" stroke-width="1.5"/>
    <text x="35" y="70" font-size="12" font-weight="bold" fill="#2c3e50">Payload (negócios)</text>
    <text x="35" y="90" font-size="11" fill="#34495e">{sender, recipient, capability, arguments}</text>

    <rect x="20" y="130" width="380" height="75" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.5"/>
    <text x="35" y="154" font-size="12" font-weight="bold" fill="#27ae60">1. Par efemero X25519 (E)</text>
    <text x="35" y="174" font-size="10.5" fill="#34495e">E_priv, E_pub gerados aleatoriamente por mensagem</text>

    <rect x="20" y="220" width="380" height="75" rx="6" fill="#fff" stroke="#8e44ad" stroke-width="1.5"/>
    <text x="35" y="244" font-size="12" font-weight="bold" fill="#8e44ad">2. Chave simétrica K ← AES-256 aleatória (256 bits)</text>
    <text x="35" y="264" font-size="10.5" fill="#34495e">Payload cifrado: C = AES-256-GCM(K, nonce, payload, AAD=cabeçalho)</text>

    <rect x="20" y="310" width="380" height="120" rx="6" fill="url(#ge)" stroke="#2980b9" stroke-width="2"/>
    <text x="35" y="334" font-size="12" font-weight="bold" fill="#1f618d">3. Encapsulamento duplo de K via ECDH + HKDF-SHA256</text>
    <text x="35" y="354" font-size="11" fill="#34495e">S_rec = E_priv · B_pub          → K_rec = HKDF(S_rec, "org-chave/recipient/v3")</text>
    <text x="35" y="372" font-size="11" fill="#34495e">S_org  = E_priv · Org_pub       → K_org  = HKDF(S_org,  "org-chave/escrow/v3")</text>
    <text x="35" y="390" font-size="11" fill="#34495e">wrap_recipient = AES-256-GCM(K_rec, nonce1, K)   wrap_org = AES-256-GCM(K_org, nonce2, K)</text>

    <rect x="20" y="445" width="380" height="80" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.5"/>
    <text x="35" y="468" font-size="12" font-weight="bold" fill="#922b21">4. Assinatura Ed25519</text>
    <text x="35" y="486" font-size="10.5" fill="#34495e">σ = Sign(A_priv_ed, cabeçalho completo incluindo wrap_recipient e wrap_org)</text>
    <text x="35" y="502" font-size="10.5" fill="#34495e">Envelope = {v, msg_id, org, sender, recipient, issued, expires, E_pub, capability, nonce, C, wrap_recipient, wrap_org, σ}</text>
  </g>

  <!-- Seta -->
  <line x1="450" y1="300" x2="510" y2="300" stroke="#2c3e50" stroke-width="3" marker-end="url(#arr)"/>
  <text x="480" y="286" text-anchor="middle" font-size="11" fill="#2c3e50">rede organizacional (JSON sobre qualquer canal)</text>

  <!-- Coluna Destinatário -->
  <g transform="translate(530,60)">
    <rect x="0" y="0" width="420" height="520" rx="10" fill="url(#gk)" stroke="#2c3e50" stroke-width="2"/>
    <text x="210" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a3a5c">Destinatário (Agente B)</text>

    <rect x="20" y="45" width="380" height="60" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.5"/>
    <text x="35" y="70" font-size="12" font-weight="bold" fill="#27ae60">1. Verifica assinatura σ</text>
    <text x="35" y="88" font-size="10.5" fill="#34495e":"Verify(A_pub_ed, σ, cabeçalho) → autenticidade e não repúdio</text>

    <rect x="20" y="120" width="380" height="60" rx="6" fill="#fff" stroke="#2980b9" stroke-width="1.5"/>
    <text x="35" y="144" font-size="12" font-weight="bold" fill="#1f618d">2. Validade temporal e organização</text>
    <text x="35" y="162" font-size="10.5" fill="#34495e":"issued/expires dentro da janela (com tolerância de relógio); org confere</text>

    <rect x="20" y="195" width="380" height="120" rx="6" fill="#fff" stroke="#e67e22" stroke-width="1.5"/>
    <text x="35" y="219" font-size="12" font-weight="bold" fill="#d35400">3. Recupera K (unwrap)</text>
    <text x="35" y="239" font-size="11" fill="#34495e">tenta: K = Unwrap(B_priv, wrap_recipient, E_pub)</text>
    <text x="35" y="257" font-size="11" fill="#34495e">se falhar e houver org_private: K = Unwrap(Org_priv, wrap_org, E_pub) ← via escrow</text>
    <text x="35" y="275" font-size="11" fill="#e74c3c">se ambos falharem → rejeita ("cannot_unwrap")</text>

    <rect x="20" y="330" width="380" height="70" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.5"/>
    <text x="35" y="354" font-size="12" font-weight="bold" fill="#27ae60">4. Descifra payload</text>
    <text x="35" y="372" font-size="10.5" fill="#34495e":"payload = AES-256-GCM-decrypt(K, nonce, C, AAD=cabeçalho)"</text>
    <text x="35" y="388" font-size="10.5" fill="#34495e">confere sender/recipient/capability contra o cabeçalho</text>

    <rect x="20" y="415" width="380" height="75" rx="6" fill="#fff" stroke="#8e44ad" stroke-width="1.5"/>
    <text x="35" y="439" font-size="12" font-weight="bold" fill="#6c3483">5. Replay + autorização + execução</text>
    <text x="35" y="457" font-size="10.5" fill="#34495e">UUID persistido (SQLite) → rejeita repetição</text>
    <text x="35" y="473" font-size="10.5" fill="#34495e">(remetente, kind, name) com permissão explícita → handler executado</text>

    <rect x="20" y="505" width="380" height="55" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.5"/>
    <text x="35" y="528" font-size="12" font-weight="bold" fill="#27ae60">6. Resposta de volta para A</text>
    <text x="35" y="545" font-size="10.5" fill="#34495e">resultado cifrado; opcionalmente empresa descriptografa via org_decrypt_message</text>
  </g>
</svg>
