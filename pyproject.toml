[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cripto-agent"
version = "0.1.0"
description = "Prototipo de interoperabilidade entre agentes com mTLS"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["cryptography>=46,<47"]

[tool.setuptools.packages.find]
include = ["cripto_agent*"]
