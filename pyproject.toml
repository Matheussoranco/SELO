[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "selo"
version = "1.0.0.dev0"
description = "SELO: extensao do A2A com criptografia de ponta a ponta nativa para comunicacao entre agentes"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "CC-BY-NC-SA-4.0" }
classifiers = [
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
]
dependencies = ["cryptography>=46,<47"]

[project.optional-dependencies]
# So para testes de interoperabilidade (ticket #17): o a2a-sdk nunca e dependencia de execucao.
interop = ["a2a-sdk[http-server]==1.3.0", "uvicorn>=0.30", "httpx>=0.27"]

[project.scripts]
selo = "selo.__main__:main"
selo-v0 = "selo_v0.__main__:main"

[tool.setuptools.packages.find]
include = ["selo*"]
